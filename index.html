<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="SkillSync Admin Dashboard" />
    
    <!-- Prevent Search Engine Indexing -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    
    <!-- Security Headers -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; connect-src 'self';">
    
    <!-- Prevent Caching of Admin Pages -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Admin Dashboard - SkillSync</title>
    
    <!-- Font Awesome - CSS only -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Vite client -->
    <script type="module">
        import RefreshRuntime from 'http://127.0.0.1:5173/@react-refresh'
        window.$RefreshReg$ = () => {}
        window.$RefreshSig$ = () => (x) => x
    </script>
</head>
<body class="bg-gray-50">
    <!-- Loading indicator -->
    <div id="loading-indicator" class="fixed inset-0 bg-white flex items-center justify-center z-50">
        <div class="text-center">
            <i class="fas fa-spinner fa-spin text-6xl text-indigo-600 mb-4"></i>
            <p class="text-gray-600 text-lg">Loading Admin Dashboard...</p>
        </div>
    </div>
    
    <div id="admin-root"></div>
    
    <!-- Notification Manager -->
    <script type="module" src="./client/public/js/notifications.js"></script>
    
    <!-- Vite entry point -->
    <script type="module" src="./client/public/admin/main.jsx"></script>
    
    <!-- Set initial auth state -->
    <script>
        const authToken = sessionStorage.getItem('authToken') || localStorage.getItem('token');
        const userDataStr = sessionStorage.getItem('userData') || localStorage.getItem('user');
        
        console.log('Admin Dashboard Loading:', {
            hasToken: !!authToken,
            hasUserData: !!userDataStr
        });
        
        if (authToken && !localStorage.getItem('token')) {
            localStorage.setItem('token', authToken);
        }
        if (userDataStr && !localStorage.getItem('user')) {
            localStorage.setItem('user', userDataStr);
        }
    </script>
</body>
</html>
