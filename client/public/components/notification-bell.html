<!-- Notification Bell Component -->
<div class="notification-container relative" id="notification-bell">
    <!-- Bell Icon -->
    <button 
        id="notification-button" 
        class="relative p-2 text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white focus:outline-none transition-colors duration-200"
        aria-label="Notifications"
        type="button"
    >
        <i class="fas fa-bell text-lg md:text-xl"></i>
        <!-- Unread Badge -->
        <span 
            id="notification-badge" 
            class="hidden absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-red-600 rounded-full"
        >
            0
        </span>
    </button>

    <!-- Dropdown Panel -->
    <div 
        id="notification-panel" 
        class="hidden absolute right-0 mt-2 w-80 md:w-96 bg-white dark:bg-gray-800 rounded-lg shadow-xl border border-gray-200 dark:border-gray-700 z-50"
        style="max-height: 600px; overflow-y: auto;"
    >
        <!-- Header -->
        <div class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-700">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Notifications</h3>
            <button 
                id="mark-all-read-btn" 
                class="text-sm text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300"
                type="button"
            >
                Mark all as read
            </button>
        </div>

        <!-- Notifications List -->
        <div id="notifications-list" class="divide-y divide-gray-100 dark:divide-gray-700">
            <!-- Notifications will be inserted here -->
        </div>

        <!-- Empty State -->
        <div id="notifications-empty" class="hidden p-8 text-center">
            <i class="fas fa-bell-slash text-4xl text-gray-300 dark:text-gray-600 mb-3"></i>
            <p class="text-gray-500 dark:text-gray-400">No notifications</p>
        </div>

        <!-- Footer -->
        <div class="p-3 border-t border-gray-200 dark:border-gray-700 text-center">
            <button 
                id="clear-read-btn" 
                class="text-sm text-gray-600 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200"
                type="button"
            >
                Clear read notifications
            </button>
        </div>
    </div>
</div>

<style>
.notification-item {
    transition: background-color 0.2s;
}

.notification-item:hover {
    background-color: #f9fafb;
}

.dark .notification-item:hover {
    background-color: rgba(107, 114, 128, 0.2);
}

.notification-item.unread {
    background-color: #eff6ff;
}

.dark .notification-item.unread {
    background-color: rgba(30, 58, 138, 0.3);
}
</style>
