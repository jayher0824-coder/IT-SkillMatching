<!-- Notification Bell Component -->
<div class="notification-container relative" id="notification-bell">
    <!-- Bell Icon -->
    <button 
        id="notification-button" 
        class="relative p-2 text-gray-600 hover:text-gray-900 focus:outline-none"
        aria-label="Notifications"
    >
        <i class="fas fa-bell text-xl"></i>
        <!-- Unread Badge -->
        <span 
            id="notification-badge" 
            class="hidden absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-red-600 rounded-full"
        >
            0
        </span>
    </button>

    <!-- Dropdown Panel -->
    <div 
        id="notification-panel" 
        class="hidden absolute right-0 mt-2 w-96 bg-white rounded-lg shadow-xl border border-gray-200 z-50"
        style="max-height: 600px; overflow-y: auto;"
    >
        <!-- Header -->
        <div class="flex items-center justify-between p-4 border-b border-gray-200">
            <h3 class="text-lg font-semibold text-gray-900">Notifications</h3>
            <button 
                id="mark-all-read-btn" 
                class="text-sm text-blue-600 hover:text-blue-800"
            >
                Mark all as read
            </button>
        </div>

        <!-- Notifications List -->
        <div id="notifications-list" class="divide-y divide-gray-100">
            <!-- Notifications will be inserted here -->
        </div>

        <!-- Empty State -->
        <div id="notifications-empty" class="hidden p-8 text-center">
            <i class="fas fa-bell-slash text-4xl text-gray-300 mb-3"></i>
            <p class="text-gray-500">No notifications</p>
        </div>

        <!-- Footer -->
        <div class="p-3 border-t border-gray-200 text-center">
            <button 
                id="clear-read-btn" 
                class="text-sm text-gray-600 hover:text-gray-800"
            >
                Clear read notifications
            </button>
        </div>
    </div>
</div>

<style>
.notification-item {
    transition: background-color 0.2s;
}

.notification-item:hover {
    background-color: #f9fafb;
}

.notification-item.unread {
    background-color: #eff6ff;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const button = document.getElementById('notification-button');
    const panel = document.getElementById('notification-panel');
    const badge = document.getElementById('notification-badge');
    const list = document.getElementById('notifications-list');
    const empty = document.getElementById('notifications-empty');
    const markAllReadBtn = document.getElementById('mark-all-read-btn');
    const clearReadBtn = document.getElementById('clear-read-btn');

    // Toggle panel
    button.addEventListener('click', (e) => {
        e.stopPropagation();
        panel.classList.toggle('hidden');
    });

    // Close panel when clicking outside
    document.addEventListener('click', (e) => {
        if (!panel.contains(e.target) && !button.contains(e.target)) {
            panel.classList.add('hidden');
        }
    });

    // Subscribe to notification updates
    window.notificationManager.subscribe(({ notifications, unreadCount }) => {
        updateBadge(unreadCount);
        renderNotifications(notifications);
    });

    // Update badge
    function updateBadge(count) {
        if (count > 0) {
            badge.textContent = count > 99 ? '99+' : count;
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }
    }

    // Render notifications
    function renderNotifications(notifications) {
        if (notifications.length === 0) {
            list.innerHTML = '';
            empty.classList.remove('hidden');
            return;
        }

        empty.classList.add('hidden');
        list.innerHTML = notifications.map(notif => createNotificationHTML(notif)).join('');

        // Add click handlers
        list.querySelectorAll('.notification-item').forEach(item => {
            const notifId = item.dataset.id;
            const notification = notifications.find(n => n._id === notifId);

            item.addEventListener('click', async () => {
                if (!notification.read) {
                    await window.notificationManager.markAsRead(notifId);
                }
                if (notification.link) {
                    window.location.href = notification.link;
                }
            });

            // Delete button
            const deleteBtn = item.querySelector('.delete-notification');
            if (deleteBtn) {
                deleteBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await window.notificationManager.deleteNotification(notifId);
                });
            }
        });
    }

    // Create notification HTML
    function createNotificationHTML(notif) {
        const icon = window.notificationManager.getNotificationIcon(notif.type);
        const color = window.notificationManager.getNotificationColor(notif.type);
        const timeAgo = window.notificationManager.timeAgo(notif.createdAt);
        const unreadClass = notif.read ? '' : 'unread';

        return `
            <div class="notification-item ${unreadClass} p-4 cursor-pointer relative" data-id="${notif._id}">
                <div class="flex items-start">
                    <div class="flex-shrink-0">
                        <i class="fas ${icon} ${color} text-lg"></i>
                    </div>
                    <div class="ml-3 flex-1">
                        <p class="text-sm font-medium text-gray-900">
                            ${notif.title}
                            ${!notif.read ? '<span class="ml-2 inline-block w-2 h-2 bg-blue-600 rounded-full"></span>' : ''}
                        </p>
                        <p class="mt-1 text-sm text-gray-600">${notif.message}</p>
                        <p class="mt-1 text-xs text-gray-400">${timeAgo}</p>
                    </div>
                    <button class="delete-notification ml-2 text-gray-400 hover:text-red-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
        `;
    }

    // Mark all as read
    markAllReadBtn.addEventListener('click', async () => {
        await window.notificationManager.markAllAsRead();
    });

    // Clear read notifications
    clearReadBtn.addEventListener('click', async () => {
        const response = await fetch('/api/notifications/clear-read', {
            method: 'DELETE',
            headers: {
                'Authorization': `Bearer ${localStorage.getItem('token')}`
            }
        });
        if (response.ok) {
            await window.notificationManager.fetchNotifications();
        }
    });

    // Start polling
    window.notificationManager.startPolling(30000); // Poll every 30 seconds
});
</script>
