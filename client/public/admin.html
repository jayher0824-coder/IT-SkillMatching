<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="SkillSync Admin Dashboard" />
    
    <!-- Prevent Search Engine Indexing -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    
    <!-- Security Headers -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.tailwindcss.com; font-src 'self' https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; connect-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;">
    
    <!-- Prevent Caching of Admin Pages -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Admin Dashboard - SkillSync</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome - CSS + JS for better icon support -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/fontawesome.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/fontawesome.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/solid.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Axios for API calls -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    
    <!-- Notification Manager -->
    <script src="/js/notifications.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
    <!-- Loading indicator -->
    <div id="loading-indicator" class="fixed inset-0 bg-white flex items-center justify-center z-50">
        <div class="text-center">
            <i class="fas fa-spinner fa-spin text-6xl text-indigo-600 mb-4"></i>
            <p class="text-gray-600 text-lg">Loading Admin Dashboard...</p>
        </div>
    </div>
    
    <div id="admin-root"></div>
    
    <!-- Admin app will handle authentication internally -->
    <script>
        // Set initial auth state for React app
        const authToken = sessionStorage.getItem('authToken') || localStorage.getItem('token');
        const userDataStr = sessionStorage.getItem('userData') || localStorage.getItem('user');
        
        console.log('Admin Dashboard Loading:', {
            hasToken: !!authToken,
            hasUserData: !!userDataStr
        });
        
        // Store in localStorage if only in sessionStorage (for React app compatibility)
        if (authToken && !localStorage.getItem('token')) {
            localStorage.setItem('token', authToken);
        }
        if (userDataStr && !localStorage.getItem('user')) {
            localStorage.setItem('user', userDataStr);
        }
    </script>
    
    <!-- Include the admin app script (without React Router) -->
    <script type="text/babel" src="/admin/js/app.js"></script>
</body>
</html>
