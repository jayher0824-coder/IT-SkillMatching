<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="SkillSync Admin Dashboard" />
    
    <!-- Prevent Search Engine Indexing -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    
    <!-- Security Headers -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <!-- Prevent Caching of Admin Pages -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Admin Dashboard - SkillSync</title>
    
    <!-- Font Awesome - CSS only -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Pre-compiled Tailwind CSS and React from Vite build -->
    <link rel="stylesheet" href="/dist/assets/index-ChnSmvp2.css">
</head>
<body class="bg-gray-50">
    <!-- Loading indicator -->
    <div id="loading-indicator" class="fixed inset-0 bg-white flex items-center justify-center z-50">
        <div class="text-center">
            <i class="fas fa-spinner fa-spin text-6xl text-indigo-600 mb-4"></i>
            <p class="text-gray-600 text-lg">Loading Admin Dashboard...</p>
        </div>
    </div>
    
    <div id="admin-root"></div>
    
    <!-- Notification Manager -->
    <script src="/js/notifications.js"></script>
    
    <!-- Pre-compiled and minified admin app with React -->
    <script src="/dist/assets/index-DdePlX9C.js"></script>
    
    <!-- Set initial auth state for React app -->
    <script>
        const authToken = sessionStorage.getItem('authToken') || localStorage.getItem('token');
        const userDataStr = sessionStorage.getItem('userData') || localStorage.getItem('user');
        
        console.log('Admin Dashboard Loading:', {
            hasToken: !!authToken,
            hasUserData: !!userDataStr
        });
        
        // Store in localStorage if only in sessionStorage
        if (authToken && !localStorage.getItem('token')) {
            localStorage.setItem('token', authToken);
        }
        if (userDataStr && !localStorage.getItem('user')) {
            localStorage.setItem('user', userDataStr);
        }
    </script>
</body>
</html>
    <!-- Include the admin app script (without React Router) -->
    <script type="text/babel" src="/admin/js/app.js"></script>
</body>
</html>
