<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="SkillSync Admin Dashboard" />
    
    <!-- Prevent Search Engine Indexing -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    
    <!-- Security Headers -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; connect-src 'self';">
    
    <!-- Prevent Caching of Admin Pages -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Admin Dashboard - SkillSync</title>
    
    <!-- Font Awesome - CSS only (no in-browser loading) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <!-- Loading indicator -->
    <div id="loading-indicator" class="fixed inset-0 bg-white flex items-center justify-center z-50">
        <div class="text-center">
            <i class="fas fa-spinner fa-spin text-6xl text-indigo-600 mb-4"></i>
            <p class="text-gray-600 text-lg">Loading Admin Dashboard...</p>
        </div>
    </div>
    
    <div id="admin-root"></div>
    
    <!-- Vite build output - precompiled React + Tailwind -->
    <script type="module" src="/dist/main.js"></script>
    
    <!-- Notification Manager -->
    <script src="/js/notifications.js"></script>
    
    <!-- Set initial auth state for React app -->
    <script>
        const authToken = sessionStorage.getItem('authToken') || localStorage.getItem('token');
        const userDataStr = sessionStorage.getItem('userData') || localStorage.getItem('user');
        
        console.log('Admin Dashboard Loading:', {
            hasToken: !!authToken,
            hasUserData: !!userDataStr
        });
        
        // Store in localStorage if only in sessionStorage (for React app compatibility)
        if (authToken && !localStorage.getItem('token')) {
            localStorage.setItem('token', authToken);
        }
        if (userDataStr && !localStorage.getItem('user')) {
            localStorage.setItem('user', userDataStr);
        }
        
        // Hide loading indicator when React app is ready
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loadingIndicator = document.getElementById('loading-indicator');
                if (loadingIndicator) {
                    loadingIndicator.style.opacity = '0';
                    loadingIndicator.style.transition = 'opacity 0.3s';
                    setTimeout(() => {
                        loadingIndicator.style.display = 'none';
                    }, 300);
                }
            }, 500);
        });
    </script>
</body>
</html>
