<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
    <title>Forgot Password - IT OJT Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <div>
                <div class="flex justify-center mb-6">
                    <img src="/images/logo.svg" alt="IT OJT Platform Logo" class="h-20 w-20">
                </div>
                <h2 id="page-title" class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                    Request Password Change
                </h2>
                <p id="page-subtitle" class="mt-2 text-center text-sm text-gray-600">
                    Enter your email to receive a verification code.
                </p>
            </div>
            
            <div id="message-container"></div>
            
            <!-- Step 1: Request Verification Code -->
            <form id="request-code-form" class="mt-8 space-y-6">
                <div class="rounded-md shadow-sm space-y-4">
                    <div>
                        <label for="email" class="sr-only">Email address</label>
                        <input 
                            id="email" 
                            name="email" 
                            type="email" 
                            autocomplete="email" 
                            required 
                            class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 focus:z-10 sm:text-sm" 
                            placeholder="Email address"
                        >
                    </div>
                </div>

                <div>
                    <button 
                        type="submit" 
                        id="request-code-btn"
                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-150"
                    >
                        <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                            <i class="fas fa-paper-plane text-green-500 group-hover:text-green-400"></i>
                        </span>
                        Send Verification Code
                    </button>
                </div>

                <div class="text-center">
                    <a href="index.html" class="font-medium text-green-600 hover:text-green-500 transition">
                        <i class="fas fa-arrow-left mr-2"></i>Back to Login
                    </a>
                </div>
            </form>

            <!-- Step 2: Verify Code and Submit Request -->
            <form id="verify-code-form" class="mt-8 space-y-6 hidden">
                <div class="rounded-md shadow-sm space-y-4">
                    <div>
                        <label for="verification-code" class="block text-sm font-medium text-gray-700 mb-2">
                            Verification Code
                        </label>
                        <input 
                            id="verification-code" 
                            name="verificationCode" 
                            type="text" 
                            maxlength="6"
                            pattern="[0-9]{6}"
                            required 
                            class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 text-center text-2xl tracking-widest font-mono focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 sm:text-sm" 
                            placeholder="000000"
                        >
                        <p class="mt-2 text-xs text-gray-500 text-center">
                            <i class="fas fa-clock mr-1"></i>
                            <span id="timer-text">Code expires in 15:00</span>
                        </p>
                    </div>

                    <div id="security-questions-container" class="space-y-4">
                        <!-- Security questions will be loaded here -->
                    </div>

                    <div>
                        <label for="reason" class="block text-sm font-medium text-gray-700 mb-2">
                            Reason for Password Reset
                        </label>
                        <textarea 
                            id="reason" 
                            name="reason" 
                            rows="3"
                            required 
                            class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 sm:text-sm" 
                            placeholder="Please explain why you need to reset your password..."
                        ></textarea>
                    </div>
                </div>

                <div>
                    <button 
                        type="submit" 
                        id="submit-request-btn"
                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-150"
                    >
                        <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                            <i class="fas fa-check text-green-500 group-hover:text-green-400"></i>
                        </span>
                        Submit Password Change Request
                    </button>
                </div>

                <div class="text-center">
                    <button 
                        type="button"
                        id="back-btn"
                        class="font-medium text-green-600 hover:text-green-500 transition"
                    >
                        <i class="fas fa-arrow-left mr-2"></i>Request New Code
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentEmail = '';
        let securityQuestions = [];
        let codeExpiryTime = null;
        let timerInterval = null;

        const requestCodeForm = document.getElementById('request-code-form');
        const verifyCodeForm = document.getElementById('verify-code-form');
        const emailInput = document.getElementById('email');
        const requestCodeBtn = document.getElementById('request-code-btn');
        const submitRequestBtn = document.getElementById('submit-request-btn');
        const backBtn = document.getElementById('back-btn');
        const messageContainer = document.getElementById('message-container');
        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');
        const timerText = document.getElementById('timer-text');

        function showMessage(message, isError = false) {
            const alertClass = isError 
                ? 'bg-red-50 border-red-200 text-red-800' 
                : 'bg-green-50 border-green-200 text-green-800';
            
            const iconClass = isError ? 'fa-exclamation-circle' : 'fa-check-circle';
            
            messageContainer.innerHTML = `
                <div class="${alertClass} border rounded-lg p-4 mb-4">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <i class="fas ${iconClass}"></i>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm font-medium">${message}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            codeExpiryTime = Date.now() + (15 * 60 * 1000); // 15 minutes
            
            timerInterval = setInterval(() => {
                const remaining = codeExpiryTime - Date.now();
                
                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    timerText.textContent = 'Code expired! Request a new one.';
                    timerText.classList.add('text-red-500');
                    return;
                }
                
                const minutes = Math.floor(remaining / 60000);
                const seconds = Math.floor((remaining % 60000) / 1000);
                timerText.textContent = `Code expires in ${minutes}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        async function loadSecurityQuestions(email) {
            try {
                console.log('Loading security questions for:', email);
                const response = await fetch(`/api/password-reset/security-questions/${encodeURIComponent(email)}`);
                console.log('Security questions response status:', response.status);
                
                if (!response.ok) {
                    console.warn('Security questions endpoint failed:', response.status);
                    // No security questions set up - that's okay
                    securityQuestions = [];
                    return;
                }
                
                const data = await response.json();
                console.log('Security questions data:', data);

                if (data.success && data.questions && data.questions.length > 0) {
                    securityQuestions = data.questions;
                    renderSecurityQuestions();
                } else {
                    securityQuestions = [];
                }
            } catch (error) {
                console.error('Error loading security questions:', error);
                securityQuestions = [];
            }
        }

        function renderSecurityQuestions() {
            const container = document.getElementById('security-questions-container');
            
            if (securityQuestions.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = securityQuestions.map((q, index) => `
                <div>
                    <label for="security-answer-${q.id}" class="block text-sm font-medium text-gray-700 mb-2">
                        ${q.question}
                    </label>
                    <input 
                        id="security-answer-${q.id}" 
                        name="securityAnswer${index}" 
                        type="text" 
                        required 
                        class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 sm:text-sm" 
                        placeholder="Your answer"
                    >
                </div>
            `).join('');
        }

        // Step 1: Request verification code
        requestCodeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            
            if (!email) {
                showMessage('Please enter your email address', true);
                return;
            }

            requestCodeBtn.disabled = true;
            requestCodeBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Sending code...';
            
            // Set a timeout to prevent infinite hanging
            const timeoutId = setTimeout(() => {
                showMessage('Request is taking too long. Please try again.', true);
                requestCodeBtn.disabled = false;
                requestCodeBtn.innerHTML = `
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i class="fas fa-paper-plane text-green-500 group-hover:text-green-400"></i>
                    </span>
                    Send Verification Code
                `;
            }, 30000); // 30 second timeout
            
            try {
                console.log('Requesting verification code for:', email);
                const response = await fetch('/api/password-reset/request-verification-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                clearTimeout(timeoutId); // Clear timeout if request completes
                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (data.success) {
                    currentEmail = email;
                    showMessage(data.message || 'Verification code sent to your email!');
                    
                    // Load security questions
                    await loadSecurityQuestions(email);
                    
                    // Switch to verification form
                    requestCodeForm.classList.add('hidden');
                    verifyCodeForm.classList.remove('hidden');
                    pageTitle.textContent = 'Verify Your Identity';
                    pageSubtitle.textContent = 'Enter the code sent to your email and complete the verification.';
                    
                    // Start countdown timer
                    startTimer();
                } else {
                    showMessage(data.message || 'Failed to send code. Please try again.', true);
                }
            } catch (error) {
                console.error('Error requesting verification code:', error);
                showMessage('An error occurred. Please try again later.', true);
            } finally {
                requestCodeBtn.disabled = false;
                requestCodeBtn.innerHTML = `
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i class="fas fa-paper-plane text-green-500 group-hover:text-green-400"></i>
                    </span>
                    Send Verification Code
                `;
            }
        });

        // Step 2: Verify code and submit request
        verifyCodeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const verificationCode = document.getElementById('verification-code').value.trim();
            const reason = document.getElementById('reason').value.trim();
            
            if (!verificationCode || verificationCode.length !== 6) {
                showMessage('Please enter a valid 6-digit verification code', true);
                return;
            }

            // Collect security answers
            const securityAnswers = {};
            securityQuestions.forEach((q, index) => {
                const answer = document.getElementById(`security-answer-${q.id}`).value.trim();
                securityAnswers[q.id] = answer;
            });

            submitRequestBtn.disabled = true;
            submitRequestBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Submitting...';
            
            try {
                const response = await fetch('/api/password-reset/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: currentEmail,
                        verificationCode,
                        reason,
                        securityAnswers
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message || 'Password change request sent to admin!');
                    
                    if (timerInterval) clearInterval(timerInterval);
                    
                    // Redirect to login after 5 seconds
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 5000);
                } else {
                    showMessage(data.message || 'Failed to submit request. Please try again.', true);
                    
                    // If code expired or invalid, allow user to go back
                    if (data.message && (data.message.includes('expired') || data.message.includes('Invalid'))) {
                        setTimeout(() => {
                            backBtn.click();
                        }, 3000);
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('An error occurred. Please try again later.', true);
            } finally {
                submitRequestBtn.disabled = false;
                submitRequestBtn.innerHTML = `
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i class="fas fa-check text-green-500 group-hover:text-green-400"></i>
                    </span>
                    Submit Password Change Request
                `;
            }
        });

        // Back button to request new code
        backBtn.addEventListener('click', () => {
            if (timerInterval) clearInterval(timerInterval);
            verifyCodeForm.classList.add('hidden');
            requestCodeForm.classList.remove('hidden');
            pageTitle.textContent = 'Request Password Change';
            pageSubtitle.textContent = 'Enter your email to receive a verification code.';
            document.getElementById('verification-code').value = '';
            document.getElementById('reason').value = '';
            messageContainer.innerHTML = '';
        });
    </script>
</body>
</html>
