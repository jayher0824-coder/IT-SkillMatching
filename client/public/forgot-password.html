<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
    <title>Forgot Password - IT OJT Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .form-card {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
        }
        .icon-box {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            border-radius: 12px;
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }
        .icon-box i {
            color: white;
            font-size: 48px;
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full">
            <!-- Header with Icon -->
            <div class="icon-box">
                <i class="fas fa-key"></i>
            </div>

            <!-- Title -->
            <h1 class="text-center text-3xl font-bold text-gray-900 mb-2">
                Request Password Change
            </h1>
            <p class="text-center text-sm text-gray-600 mb-8">
                Enter your email to request a password reset.
            </p>

            <!-- Message Container -->
            <div id="message-container" class="mb-6"></div>

            <!-- Form -->
            <form id="forgot-password-form" class="form-card bg-white p-8 space-y-6">
                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        Email address
                    </label>
                    <input 
                        id="email" 
                        name="email" 
                        type="email" 
                        autocomplete="email" 
                        required 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition" 
                        placeholder="you@example.com"
                    >
                </div>

                <!-- Phone Number -->
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-phone mr-1 text-green-600"></i>Phone Number (Required for SMS)
                    </label>
                    <input
                        id="phone"
                        type="tel"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition"
                        placeholder="+63 912 345 6789"
                    >
                    <p class="mt-2 text-xs text-gray-500">
                        <i class="fas fa-info-circle mr-1"></i>Admin will send your new password to this number via SMS
                    </p>
                </div>

                <!-- Optional Reason -->
                <div>
                    <label for="reason" class="block text-sm font-medium text-gray-700 mb-2">
                        Reason for password reset (optional)
                    </label>
                    <textarea
                        id="reason"
                        rows="3"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition resize-none"
                        placeholder="Why do you need to reset your password?"
                    ></textarea>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submit-btn"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-lg transition duration-200 flex items-center justify-center"
                >
                    <i class="fas fa-paper-plane mr-2"></i>Continue
                </button>
            </form>

            <!-- Back to Login Link -->
            <div class="text-center mt-6">
                <a href="index.html" class="text-green-600 hover:text-green-700 font-medium text-sm transition">
                    <i class="fas fa-arrow-left mr-1"></i>Back to Login
                </a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('forgot-password-form');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const reasonInput = document.getElementById('reason');
        const submitBtn = document.getElementById('submit-btn');
        const messageContainer = document.getElementById('message-container');

        function showMessage(message, isError = false) {
            const bgClass = isError ? 'bg-red-50 border-l-4 border-red-500' : 'bg-green-50 border-l-4 border-green-500';
            const textClass = isError ? 'text-red-700' : 'text-green-700';
            const iconClass = isError ? 'fa-exclamation-circle text-red-500' : 'fa-check-circle text-green-500';
            
            messageContainer.innerHTML = `
                <div class="${bgClass} p-4 rounded">
                    <div class="flex items-start">
                        <i class="fas ${iconClass} mt-0.5 mr-3"></i>
                        <p class="${textClass} text-sm font-medium">${message}</p>
                    </div>
                </div>
            `;
            messageContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function validatePhone(phone) {
            // Remove spaces and common phone separators
            const cleaned = phone.replace(/[\s\-\(\)]/g, '');
            return cleaned.length >= 10;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const phone = phoneInput.value.trim();
            const reason = reasonInput.value.trim();

            // Validation
            if (!email) {
                showMessage('Please enter your email address', true);
                emailInput.focus();
                return;
            }

            if (!validateEmail(email)) {
                showMessage('Please enter a valid email address', true);
                emailInput.focus();
                return;
            }

            if (!phone) {
                showMessage('Please enter your phone number', true);
                phoneInput.focus();
                return;
            }

            if (!validatePhone(phone)) {
                showMessage('Please enter a valid phone number (at least 10 digits)', true);
                phoneInput.focus();
                return;
            }

            // Submit request
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Submitting...';

            try {
                const response = await fetch('/api/password-reset/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        phoneNumber: phone,
                        reason: reason || undefined
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('✓ Password reset request submitted successfully! Please check your SMS for further instructions.');
                    form.reset();
                    
                    // Redirect to login after 4 seconds
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 4000);
                } else {
                    showMessage(data.message || 'Failed to submit request. Please try again.', true);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i>Continue';
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('An error occurred. Please check your internet connection and try again.', true);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i>Continue';
            }
        });

        // Real-time phone number validation
        phoneInput.addEventListener('blur', () => {
            if (phoneInput.value.trim() && !validatePhone(phoneInput.value)) {
                phoneInput.classList.add('border-red-500');
            } else {
                phoneInput.classList.remove('border-red-500');
            }
        });
    </script>
</body>
</html>
