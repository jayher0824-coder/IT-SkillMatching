<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
    <title>Forgot Password - IT OJT Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .icon-box {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            border-radius: 15px;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .icon-box i {
            color: white;
            font-size: 60px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1f2937;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: #6b7280;
            text-align: center;
            margin-bottom: 30px;
        }

        #message-container {
            margin-bottom: 20px;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 14px;
            animation: slideIn 0.3s ease;
        }

        .alert-success {
            background-color: #d1fae5;
            border-color: #10b981;
            color: #065f46;
        }

        .alert-error {
            background-color: #fee2e2;
            border-color: #ef4444;
            color: #7f1d1d;
        }

        .alert i {
            font-size: 16px;
            margin-top: 2px;
            flex-shrink: 0;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group:last-of-type {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }

        label i {
            color: #10b981;
            margin-right: 4px;
        }

        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            background-color: #f9fafb;
        }

        input[type="email"]:focus,
        input[type="tel"]:focus,
        textarea:focus {
            outline: none;
            background-color: white;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        input[type="email"]::placeholder,
        input[type="tel"]::placeholder,
        textarea::placeholder {
            color: #9ca3af;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            max-height: 200px;
        }

        .helper-text {
            font-size: 12px;
            color: #6b7280;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .helper-text i {
            font-size: 12px;
            color: #10b981;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            margin-top: 10px;
        }

        .submit-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .submit-btn i {
            font-size: 16px;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .back-link a:hover {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .back-link i {
            font-size: 14px;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 26px;
            }

            .form-card {
                padding: 20px;
            }

            .icon-box {
                padding: 30px;
                margin-bottom: 20px;
            }

            .icon-box i {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header with Icon -->
        <div class="icon-box">
            <i class="fas fa-key"></i>
        </div>

        <!-- Title -->
        <h1>Reset Your Password</h1>
        <p class="subtitle">Enter your email and we will send you a reset link.</p>

        <!-- Message Container -->
        <div id="message-container"></div>

        <!-- Form -->
        <form id="forgot-password-form" class="form-card">
            <!-- Email Input -->
            <div class="form-group">
                <label for="email">Email address</label>
                <input 
                    id="email" 
                    name="email" 
                    type="email" 
                    autocomplete="email" 
                    required 
                    placeholder="you@example.com"
                >
            </div>

            <p class="helper-text">
                <i class="fas fa-info-circle"></i>A secure reset link will be sent to your email address.
            </p>

            <!-- Submit Button -->
            <button 
                type="submit" 
                id="submit-btn"
                class="submit-btn"
            >
                <i class="fas fa-paper-plane"></i>Continue
            </button>
        </form>

        <!-- Back to Login Link -->
        <div class="back-link">
            <a href="index.html">
                <i class="fas fa-arrow-left"></i>Back to Login
            </a>
        </div>
    </div>

    <script>
        const form = document.getElementById('forgot-password-form');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submit-btn');
        const messageContainer = document.getElementById('message-container');

        function showMessage(message, isError = false) {
            const alertClass = isError ? 'alert-error' : 'alert-success';
            const iconClass = isError ? 'fa-exclamation-circle' : 'fa-check-circle';
            
            messageContainer.innerHTML = `
                <div class="alert ${alertClass}">
                    <i class="fas ${iconClass}"></i>
                    <p>${message}</p>
                </div>
            `;
            messageContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();

            // Validation
            if (!email) {
                showMessage('Please enter your email address', true);
                emailInput.focus();
                return;
            }

            if (!validateEmail(email)) {
                showMessage('Please enter a valid email address', true);
                emailInput.focus();
                return;
            }

            // Submit request
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>Submitting...';

            try {
                const response = await fetch('/api/password-reset/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.success) {
                    if (data.emailFailed) {
                        // Email delivery failed — admin has been notified via in-app notification
                        showMessage(data.message || 'We could not send the reset email. The administrator has been notified and will assist you shortly.');
                        form.reset();
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i>Continue';
                    } else {
                        showMessage(data.message || 'If an account exists with this email, a reset link has been sent. Please check your inbox.');
                        form.reset();
                        // Redirect to login after 4 seconds
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 4000);
                    }
                } else {
                    showMessage(data.message || 'Failed to submit request. Please try again.', true);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i>Continue';
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('An error occurred. Please check your internet connection and try again.', true);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i>Continue';
            }
        });
    </script>
</body>
</html>
