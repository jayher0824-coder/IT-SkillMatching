<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
    <title>Forgot Password - IT OJT Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <div>
                <div class="flex justify-center mb-6">
                    <img src="/images/logo.svg" alt="IT OJT Platform Logo" class="h-20 w-20">
                </div>
                <h2 id="page-title" class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                    Request Password Change
                </h2>
                <p id="page-subtitle" class="mt-2 text-center text-sm text-gray-600">
                    Enter your email to request a password reset.
                </p>
            </div>
            
            <div id="message-container"></div>
            
            <!-- Password Reset Request Form -->
            <form id="request-code-form" class="mt-8 space-y-6">
                <div class="rounded-md shadow-sm space-y-4">
                    <div>
                        <label for="email" class="sr-only">Email address</label>
                        <input 
                            id="email" 
                            name="email" 
                            type="email" 
                            autocomplete="email" 
                            required 
                            class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 focus:z-10 sm:text-sm" 
                            placeholder="Email address"
                        >
                    </div>
                    
                    <!-- Security Questions Container (will be loaded dynamically) -->
                    <div id="security-questions-container" class="hidden space-y-4"></div>
                    
                    <!-- Phone Number -->
                    <div id="phone-container" class="hidden">
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-phone mr-1 text-green-600"></i>
                            Phone Number (Required for SMS)
                        </label>
                        <input
                            id="phone"
                            type="tel"
                            required
                            class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 sm:text-sm"
                            placeholder="+63 912 345 6789"
                        >
                        <p class="mt-1 text-xs text-gray-500">Admin will send your new password to this number via SMS</p>
                    </div>
                    
                    <!-- Optional Reason -->
                    <div id="reason-container" class="hidden">
                        <label for="reason" class="block text-sm font-medium text-gray-700 mb-2">
                            Reason for password reset (optional)
                        </label>
                        <textarea
                            id="reason"
                            rows="3"
                            class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 sm:text-sm"
                            placeholder="Why do you need to reset your password?"
                        ></textarea>
                    </div>
                </div>

                <div>
                    <button 
                        type="submit" 
                        id="request-code-btn"
                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-150"
                    >
                        <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                            <i class="fas fa-paper-plane text-green-500 group-hover:text-green-400"></i>
                        </span>
                        Continue
                    </button>
                </div>

                <div class="text-center">
                    <a href="index.html" class="font-medium text-green-600 hover:text-green-500 transition">
                        <i class="fas fa-arrow-left mr-2"></i>Back to Login
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentEmail = '';
        let securityQuestions = [];
        let hasCheckedEmail = false;

        const requestCodeForm = document.getElementById('request-code-form');
        const emailInput = document.getElementById('email');
        const requestCodeBtn = document.getElementById('request-code-btn');
        const messageContainer = document.getElementById('message-container');
        const securityQuestionsContainer = document.getElementById('security-questions-container');
        const reasonContainer = document.getElementById('reason-container');
        const phoneContainer = document.getElementById('phone-container');

        function showMessage(message, isError = false) {
            const alertClass = isError 
                ? 'bg-red-50 border-red-200 text-red-800' 
                : 'bg-green-50 border-green-200 text-green-800';
            
            const iconClass = isError ? 'fa-exclamation-circle' : 'fa-check-circle';
            
            messageContainer.innerHTML = `
                <div class="${alertClass} border rounded-lg p-4 mb-4">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <i class="fas ${iconClass}"></i>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm font-medium">${message}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        async function loadSecurityQuestions(email) {
            try {
                const response = await fetch(`/api/password-reset/security-questions/${encodeURIComponent(email)}`);
                
                if (!response.ok) {
                    securityQuestions = [];
                    return;
                }
                
                const data = await response.json();

                if (data.success && data.questions && data.questions.length > 0) {
                    securityQuestions = data.questions;
                    renderSecurityQuestions();
                } else {
                    securityQuestions = [];
                }
            } catch (error) {
                console.error('Error loading security questions:', error);
                securityQuestions = [];
            }
        }

        function renderSecurityQuestions() {
            if (securityQuestions.length === 0) {
                securityQuestionsContainer.innerHTML = '';
                securityQuestionsContainer.classList.add('hidden');
                return;
            }

            securityQuestionsContainer.classList.remove('hidden');
            securityQuestionsContainer.innerHTML = `
                <div class="border-t border-gray-200 pt-4">
                    <h3 class="text-sm font-medium text-gray-900 mb-3">
                        <i class="fas fa-shield-alt mr-2 text-green-600"></i>Security Questions
                    </h3>
                    ${securityQuestions.map((q, index) => `
                        <div class="mb-4">
                            <label for="security-answer-${q.id}" class="block text-sm font-medium text-gray-700 mb-2">
                                ${q.question}
                            </label>
                            <input 
                                id="security-answer-${q.id}" 
                                name="securityAnswer${index}" 
                                type="text" 
                                required 
                                class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 sm:text-sm" 
                                placeholder="Your answer"
                            >
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Handle form submission
        requestCodeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            
            if (!email) {
                showMessage('Please enter your email address', true);
                return;
            }

            // First submission: Load security questions
            if (!hasCheckedEmail) {
                requestCodeBtn.disabled = true;
                requestCodeBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Loading...';
                
                try {
                    currentEmail = email;
                    await loadSecurityQuestions(email);
                    
                    // Show reason field and change button text
                    reasonContainer.classList.remove('hidden');
                    phoneContainer.classList.remove('hidden');
                    emailInput.disabled = true;
                    hasCheckedEmail = true;
                    
                    requestCodeBtn.innerHTML = `
                        <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                            <i class="fas fa-paper-plane text-green-500 group-hover:text-green-400"></i>
                        </span>
                        Submit Request
                    `;
                    
                    if (securityQuestions.length > 0) {
                        showMessage('Please answer your security questions below.');
                    } else {
                        showMessage('You can now submit your password reset request.');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showMessage('An error occurred. Please try again.', true);
                } finally {
                    requestCodeBtn.disabled = false;
                }
                return;
            }

            // Second submission: Submit password reset request
            const reason = document.getElementById('reason').value.trim();
            const phone = document.getElementById('phone').value.trim();

            // Validate phone number
            if (!phone) {
                showMessage('Please enter your phone number', true);
                return;
            }

            if (phone.length < 10) {
                showMessage('Please enter a valid phone number', true);
                return;
            }

            // Collect security answers
            const securityAnswers = {};
            securityQuestions.forEach((q) => {
                const answer = document.getElementById(`security-answer-${q.id}`)?.value.trim();
                if (answer) {
                    securityAnswers[q.id] = answer;
                }
            });

            requestCodeBtn.disabled = true;
            requestCodeBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Submitting...';
            
            try {
                const response = await fetch('/api/password-reset/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: currentEmail,
                        reason,
                        phoneNumber: phone,
                        securityAnswers: Object.keys(securityAnswers).length > 0 ? securityAnswers : undefined
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message || 'Password reset request submitted successfully!');
                    
                    // Redirect to login after 3 seconds
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);
                } else {
                    showMessage(data.message || 'Failed to submit request. Please try again.', true);
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('An error occurred. Please try again later.', true);
            } finally {
                requestCodeBtn.disabled = false;
                requestCodeBtn.innerHTML = `
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i class="fas fa-paper-plane text-green-500 group-hover:text-green-400"></i>
                    </span>
                    Submit Request
                `;
            }
        });
    </script>
</body>
</html>
