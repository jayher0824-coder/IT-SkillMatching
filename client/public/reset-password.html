<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
    <title>Reset Password - SkillSync</title>
    <style>
        :root {
            --bg-top: #0f172a;
            --bg-mid: #1e3a8a;
            --bg-bottom: #38bdf8;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: #cbd5e1;
            --accent: #0ea5e9;
            --accent-hover: #0284c7;
            --success-bg: #dcfce7;
            --success-border: #86efac;
            --success-text: #166534;
            --error-bg: #fee2e2;
            --error-border: #fca5a5;
            --error-text: #991b1b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            background:
                radial-gradient(1200px 600px at 0% 0%, rgba(255,255,255,0.08), transparent 55%),
                linear-gradient(150deg, var(--bg-top) 0%, var(--bg-mid) 58%, var(--bg-bottom) 100%);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .panel {
            width: min(520px, 100%);
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 18px;
            box-shadow: 0 22px 50px rgba(2, 6, 23, 0.35);
            overflow: hidden;
        }

        .hero {
            padding: 24px;
            background: linear-gradient(135deg, #082f49, #0c4a6e);
            color: #fff;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .hero img {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: rgba(255,255,255,0.12);
            padding: 8px;
        }

        .hero h1 {
            margin: 0;
            font-size: 1.3rem;
            letter-spacing: 0.2px;
        }

        .hero p {
            margin: 4px 0 0;
            font-size: 0.9rem;
            color: #dbeafe;
        }

        .content {
            padding: 24px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1e293b;
        }

        .input-wrap {
            display: grid;
            grid-template-columns: 1fr 42px;
            gap: 8px;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            color: #0f172a;
            background: #fff;
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(14,165,233,0.18);
        }

        .toggle {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #f8fafc;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .actions {
            margin-top: 20px;
            display: grid;
            gap: 14px;
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 12px 14px;
            font-weight: 700;
            font-size: 0.96rem;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), #0369a1);
            cursor: pointer;
            transition: transform .15s ease, opacity .2s ease;
        }

        .btn:hover { transform: translateY(-1px); }
        .btn:disabled { opacity: .65; cursor: not-allowed; transform: none; }

        .link-back {
            text-align: center;
            color: #0369a1;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.93rem;
        }

        .alert {
            border-radius: 10px;
            border: 1px solid;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 0.93rem;
            font-weight: 600;
        }

        .alert.success {
            background: var(--success-bg);
            border-color: var(--success-border);
            color: var(--success-text);
        }

        .alert.error {
            background: var(--error-bg);
            border-color: var(--error-border);
            color: var(--error-text);
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="hero">
            <img src="/images/logo.svg" alt="SkillSync logo">
            <div>
                <h1>Create New Password</h1>
                <p>Set a secure password for your account.</p>
            </div>
        </div>
        <div class="content">
            <div id="message-container"></div>

            <form id="reset-password-form">
                <div class="field">
                    <label for="password">New Password</label>
                    <div class="input-wrap">
                        <input id="password" name="password" type="password" required minlength="6" placeholder="Enter new password (min. 6 characters)">
                        <button class="toggle" type="button" id="password-icon" onclick="togglePassword('password')">Show</button>
                    </div>
                </div>

                <div class="field">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="input-wrap">
                        <input id="confirm-password" name="confirm-password" type="password" required minlength="6" placeholder="Confirm new password">
                        <button class="toggle" type="button" id="confirm-password-icon" onclick="togglePassword('confirm-password')">Show</button>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" id="submit-btn" class="btn">Reset Password</button>
                    <a href="index.html" class="link-back">Back to Login</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('reset-password-form');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const submitBtn = document.getElementById('submit-btn');
        const messageContainer = document.getElementById('message-container');

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Verify token on page load
        if (!token) {
            showMessage('Invalid reset link. Please request a new password reset.', true);
            submitBtn.disabled = true;
        } else {
            verifyToken();
        }

        async function verifyToken() {
            try {
                const response = await fetch(`/api/password-reset/verify-reset-token/${token}`);
                const data = await response.json();

                if (!data.success) {
                    showMessage('This reset link is invalid or has expired. Please request a new one.', true);
                    submitBtn.disabled = true;
                    
                    setTimeout(() => {
                        window.location.href = 'forgot-password.html';
                    }, 3000);
                }
            } catch (error) {
                console.error('Error verifying token:', error);
                showMessage('Error verifying reset link. Please try again.', true);
                submitBtn.disabled = true;
            }
        }

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(`${fieldId}-icon`);
            
            if (field.type === 'password') {
                field.type = 'text';
                icon.textContent = 'Hide';
            } else {
                field.type = 'password';
                icon.textContent = 'Show';
            }
        }

        function showMessage(message, isError = false) {
            messageContainer.innerHTML = `
                <div class="alert ${isError ? 'error' : 'success'}">
                    ${message}
                </div>
            `;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            // Validation
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters long', true);
                return;
            }

            if (password !== confirmPassword) {
                showMessage('Passwords do not match', true);
                return;
            }

            // Disable form
            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';
            
            try {
                const response = await fetch('/api/password-reset/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        token,
                        newPassword: password 
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message || 'Password reset successfully! Redirecting to login...');
                    
                    // Clear form
                    form.reset();
                    
                    // Redirect to login after 3 seconds
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);
                } else {
                    showMessage(data.message || 'Failed to reset password. Please try again.', true);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset Password';
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('An error occurred. Please try again later.', true);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
