<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - SkillSync</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="/css/chat.css" rel="stylesheet">
    <style>
        .new-chat-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.5);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .new-chat-overlay.show {
            display: flex;
        }

        .new-chat-card {
            width: min(560px, 100%);
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 18px 40px rgba(2, 6, 23, 0.25);
            border: 1px solid #e5e7eb;
            padding: 22px;
        }

        .new-chat-title {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            color: #111827;
        }

        .new-chat-close {
            border: none;
            background: transparent;
            font-size: 1.6rem;
            line-height: 1;
            color: #64748b;
            cursor: pointer;
        }

        .new-chat-close:hover { color: #334155; }

        .new-chat-label {
            display: block;
            font-size: .95rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .new-chat-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            color: #0f172a;
            outline: none;
            background: #fff;
        }

        .new-chat-input:focus {
            border-color: #56AE67;
            box-shadow: 0 0 0 3px rgba(86,174,103,.18);
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: none;
            background: #56AE67;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s ease, transform .12s ease;
            margin-top: 14px;
        }

        .new-chat-btn:hover { background: #3d8b4f; }
        .new-chat-btn:active { transform: translateY(1px); }

        .new-chat-selected {
            margin-top: 10px;
            color: #334155;
            font-size: .92rem;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900">
    <div class="container mx-auto px-4 py-8">
        <div class="mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">
                    <i class="fas fa-comments mr-2" style="color: #56AE67;"></i>
                    Messages
                </h1>
                <p class="text-gray-600 dark:text-gray-400">Chat with students, companies, and administrators</p>
            </div>
            <button id="back-to-dashboard-btn" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition">
                <i class="fas fa-arrow-left mr-2"></i>Back to Dashboard
            </button>
        </div>

        <!-- Chat Container -->
        <div class="chat-container bg-white dark:bg-gray-800">
            <!-- Sidebar -->
            <div class="chat-sidebar mobile-show">
                <!-- Header -->
                <div class="chat-header">
                    <div class="flex items-center justify-between">
                        <h2 class="text-lg font-semibold text-gray-900 dark:text-white">
                            Conversations
                        </h2>
                        <button id="new-chat-btn" class="text-[#56AE67] hover:text-[#3d8b4f]">
                            <i class="fas fa-plus-circle text-xl"></i>
                        </button>
                    </div>
                </div>

                <!-- Search -->
                <div class="chat-search">
                    <input 
                        type="text" 
                        id="chat-search-input"
                        placeholder="Search conversations..." 
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-[#56AE67]">
                </div>

                <!-- Conversations List -->
                <div class="chat-list" id="chat-conversations-list">
                    <!-- Conversations will be loaded here -->
                    <div class="p-8 text-center text-gray-500 dark:text-gray-400">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#56AE67] mx-auto mb-4"></div>
                        <p>Loading conversations...</p>
                    </div>
                </div>
            </div>

            <!-- Main Chat Area -->
            <div class="chat-main">
                <!-- Chat Header -->
                <div class="chat-header" id="chat-header">
                    <div class="chat-empty-state">
                        <i class="fas fa-comment-dots text-6xl mb-4 text-gray-300 dark:text-gray-600"></i>
                        <h3 class="text-xl font-semibold mb-2">Select a conversation</h3>
                        <p>Choose a conversation from the list to start messaging</p>
                    </div>
                </div>

                <!-- Messages -->
                <div class="chat-messages" id="chat-messages-container">
                    <div class="chat-empty-state">
                        <i class="fas fa-comment-dots text-6xl mb-4 text-gray-300 dark:text-gray-600"></i>
                        <h3 class="text-xl font-semibold mb-2">Select a conversation</h3>
                        <p>Choose a conversation from the list to start messaging</p>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="chat-input-container">
                    <div class="chat-input">
                        <textarea 
                            id="chat-message-input"
                            placeholder="Select a conversation to start messaging..."
                            rows="1"
                            disabled
                            class="flex-1 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg resize-none bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-[#56AE67]"></textarea>
                        <button 
                            id="chat-send-btn"
                            disabled
                            class="chat-send-btn">
                            <i class="fas fa-paper-plane"></i>
                            <span>Send</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- New Chat Modal -->
    <div id="new-chat-modal" class="new-chat-overlay">
        <div class="new-chat-card">
            <div class="flex justify-between items-center mb-4">
                <h3 class="new-chat-title">Start New Conversation</h3>
                <button id="close-modal-btn" class="new-chat-close" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="new-chat-label">Select User</label>
                    <div class="relative">
                        <!-- Search Input -->
                        <input type="text" id="user-search-input" 
                            class="new-chat-input"
                            placeholder="Search by name or email...">
                        
                        <!-- User List Dropdown -->
                        <div id="user-dropdown" class="hidden absolute top-full left-0 right-0 mt-0 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg shadow-lg z-40 max-h-64 overflow-y-auto">
                            <div id="user-list" class="space-y-0">
                                <!-- Users will be populated here -->
                            </div>
                        </div>
                        
                        <!-- Hidden input for user ID -->
                        <input type="hidden" id="new-chat-user" value="">
                    </div>
                    <div id="selected-user-display" class="new-chat-selected"></div>
                </div>
                
                <button type="button" id="start-chat-btn" class="new-chat-btn">
                    <i class="fas fa-comment-alt mr-2"></i><span>Start Conversation</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/sanitize.js"></script>
    <script src="/js/helpers.js"></script>
    <script src="/js/chat.js"></script>
    <script>
        // Initialize chat when page loads
        document.addEventListener('DOMContentLoaded', async () => {
            // Check authentication - support multiple auth methods
            const authToken = sessionStorage.getItem('authToken') || localStorage.getItem('token');
            const userData = sessionStorage.getItem('userData') || localStorage.getItem('userData');
            
            if (!authToken) {
                console.warn('No auth token found, redirecting to login');
                // Redirect to appropriate login page based on context
                if (window.location.pathname.includes('admin')) {
                    window.location.href = '/admin.html';
                } else {
                    window.location.href = '/';
                }
                return;
            }
            
            // Ensure user data is available in session storage for chat
            if (userData) {
                try {
                    const user = JSON.parse(userData);
                    // Store in both storage methods for compatibility
                    sessionStorage.setItem('user', JSON.stringify(user));
                    sessionStorage.setItem('userData', JSON.stringify(user));
                    
                    // Also ensure authToken is in sessionStorage for API calls
                    if (!sessionStorage.getItem('authToken')) {
                        sessionStorage.setItem('authToken', authToken);
                    }
                } catch (e) {
                    console.error('Failed to parse user data:', e);
                }
            } else {
                // If no userData, try to fetch current user from API
                try {
                    const response = await fetch('/api/auth/me', {
                        headers: {
                            'Authorization': `Bearer ${authToken}`
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.success && data.data) {
                            const user = data.data;
                            sessionStorage.setItem('user', JSON.stringify(user));
                            sessionStorage.setItem('userData', JSON.stringify(user));
                            sessionStorage.setItem('authToken', authToken);
                        }
                    }
                } catch (error) {
                    console.error('Failed to fetch user data:', error);
                }
            }

            // Add event listeners
            setupEventListeners();

            try {
                // Initialize chat manager
                await window.chatManager.init();
                
                // Check URL for conversation ID
                const urlParams = new URLSearchParams(window.location.search);
                const conversationId = urlParams.get('conversation');
                if (conversationId) {
                    await window.chatManager.selectConversation(conversationId);
                }
            } catch (error) {
                console.error('Error initializing chat:', error);
                showToast('Error loading chat', 'error');
            }
        });

        // Setup all event listeners
        function setupEventListeners() {
            // Back to dashboard button
            const backBtn = document.getElementById('back-to-dashboard-btn');
            if (backBtn) {
                backBtn.addEventListener('click', () => {
                    // Get user role from session storage
                    const userDataStr = sessionStorage.getItem('userData');
                    let userRole = 'student'; // default
                    
                    if (userDataStr) {
                        try {
                            const userData = JSON.parse(userDataStr);
                            userRole = userData.role || 'student';
                        } catch (e) {
                            console.error('Failed to parse user data:', e);
                        }
                    }
                    
                    // Redirect based on user role
                    if (userRole === 'admin') {
                        window.location.href = '/admin.html';
                    } else {
                        // Both student and company users go to dashboard.html
                        window.location.href = '/dashboard.html';
                    }
                });
            }

            // New chat button
            const newChatBtn = document.getElementById('new-chat-btn');
            if (newChatBtn) {
                newChatBtn.addEventListener('click', showNewChatModal);
            }

            // Search input
            const searchInput = document.getElementById('chat-search-input');
            if (searchInput) {
                searchInput.addEventListener('keyup', searchConversations);
            }

            // Message input
            const messageInput = document.getElementById('chat-message-input');
            if (messageInput) {
                messageInput.addEventListener('input', function() {
                    autoResizeTextarea(this);
                });
                messageInput.addEventListener('keypress', handleChatKeyPress);
            }

            // Send button
            const sendBtn = document.getElementById('chat-send-btn');
            if (sendBtn) {
                sendBtn.addEventListener('click', sendChatMessage);
            }

            // Modal close button
            const closeModalBtn = document.getElementById('close-modal-btn');
            if (closeModalBtn) {
                closeModalBtn.addEventListener('click', closeNewChatModal);
            }

            // Start chat button
            const startChatBtn = document.getElementById('start-chat-btn');
            if (startChatBtn) {
                startChatBtn.addEventListener('click', startNewChat);
            }
        }

        // New chat modal functions
        async function showNewChatModal() {
            const modal = document.getElementById('new-chat-modal');
            const userList = document.getElementById('user-list');
            const select = document.getElementById('new-chat-user');
            const searchInput = document.getElementById('user-search-input');
            const selectedDisplay = document.getElementById('selected-user-display');
            const userDropdown = document.getElementById('user-dropdown');
            
            // Reset form state
            select.value = '';
            searchInput.value = '';
            selectedDisplay.textContent = '';
            selectedDisplay.style.display = 'none';
            userDropdown.classList.add('hidden');
            
            // Show modal
            modal.classList.remove('hidden');
            modal.classList.add('show');
            
            // Load users
            try {
                userList.innerHTML = '<div class="px-4 py-2 text-gray-700 dark:text-gray-400">Loading users...</div>';
                
                const response = await apiCall('/messages/available-users');
                
                if (response.success && response.data.length > 0) {
                    window.availableUsers = response.data;
                    renderUserList(response.data);
                } else {
                    userList.innerHTML = '<div class="px-4 py-2 text-gray-700 dark:text-gray-400">No users available</div>';
                }
                    
            } catch (error) {
                console.error('Error loading users:', error);
                userList.innerHTML = '<div class="px-4 py-2 text-red-500">Error loading users</div>';
            }
        }

        function renderUserList(users) {
            const userList = document.getElementById('user-list');
            const userDropdown = document.getElementById('user-dropdown');
            
            if (users.length === 0) {
                userList.innerHTML = '<div class="px-4 py-2 text-gray-700 dark:text-gray-400">No users found</div>';
                userDropdown.classList.remove('hidden');
                return;
            }
            
            userList.innerHTML = users.map(u => `
                <button type="button" 
                    class="user-select-btn w-full text-left px-4 py-2 text-gray-900 dark:text-gray-100 hover:bg-[#56AE67] hover:text-white dark:hover:bg-[#3d8b4f] transition border-b border-gray-200 dark:border-gray-600 last:border-b-0"
                    data-user-id="${String(u._id)}"
                    data-user-display="${u.displayName} - ${u.email} (${u.type})">
                    <div class="font-medium">${u.displayName}</div>
                    <div class="text-xs text-gray-600 dark:text-gray-400">${u.email}</div>
                    <div class="text-xs"><span class="inline-block px-2 py-0.5 bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 rounded">${u.type}</span></div>
                </button>
            `).join('');
            
            // Add event listeners to user buttons
            userList.querySelectorAll('.user-select-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const userId = this.dataset.userId;
                    const displayText = this.dataset.userDisplay;
                    console.log('User button clicked:', userId, displayText);
                    selectUser(userId, displayText);
                });
            });
            
            userDropdown.classList.remove('hidden');
        }


        window.selectUser = function(userId, displayText) {
            const select = document.getElementById('new-chat-user');
            const selectedDisplay = document.getElementById('selected-user-display');
            const userDropdown = document.getElementById('user-dropdown');
            const searchInput = document.getElementById('user-search-input');
            
            // Set the select value
            select.value = userId;
            console.log('Selected user ID:', userId, 'Select value now:', select.value);
            
            // Update display
            selectedDisplay.textContent = '✓ Selected: ' + displayText;
            selectedDisplay.style.display = 'block';
            
            // Hide dropdown and clear search
            userDropdown.classList.add('hidden');
            searchInput.value = displayText;
        }

        window.closeNewChatModal = function() {
            const modal = document.getElementById('new-chat-modal');
            const select = document.getElementById('new-chat-user');
            const selectedDisplay = document.getElementById('selected-user-display');
            const searchInput = document.getElementById('user-search-input');
            const userDropdown = document.getElementById('user-dropdown');
            
            // Reset form
            select.value = '';
            selectedDisplay.textContent = '';
            selectedDisplay.style.display = 'none';
            searchInput.value = '';
            userDropdown.classList.add('hidden');
            
            // Hide modal
            modal.classList.remove('show');
            modal.classList.add('hidden');
        }

        async function startNewChat() {
            try {
                const userInput = document.getElementById('new-chat-user');
                const userId = userInput.value?.trim();
                
                console.log('Start chat clicked.');
                console.log('User input element:', userInput);
                console.log('User input value:', userInput.value);
                console.log('Selected user ID after trim:', userId);
                console.log('Value is truthy:', !!userId);
                
                if (!userId) {
                    showToast('Please select a user from the list first', 'error');
                    return;
                }
                
                console.log('Creating conversation with user:', userId);
                closeNewChatModal();
                await window.chatManager.createConversation(userId);
            } catch (error) {
                console.error('Error starting chat:', error);
                showToast('Failed to start conversation', 'error');
            }
        }

        // Setup search functionality when modal is shown
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('user-search-input');
            const userDropdown = document.getElementById('user-dropdown');
            
            if (searchInput) {
                searchInput.addEventListener('focus', () => {
                    if (window.availableUsers) {
                        renderUserList(window.availableUsers);
                    }
                });
                
                searchInput.addEventListener('input', (e) => {
                    const searchTerm = e.target.value.toLowerCase();
                    
                    if (!window.availableUsers) return;
                    
                    const filtered = window.availableUsers.filter(u => 
                        u.displayName.toLowerCase().includes(searchTerm) ||
                        u.email.toLowerCase().includes(searchTerm) ||
                        u.type.toLowerCase().includes(searchTerm)
                    );
                    
                    renderUserList(filtered);
                });
            }
            
            // Close dropdown when clicking outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#user-search-input') && !e.target.closest('#user-dropdown')) {
                    userDropdown.classList.add('hidden');
                }
            });
        });

        // Toast notification function
        function showToast(message, type = 'info') {
            console.log(`[${type.toUpperCase()}] ${message}`);
            // You can implement a proper toast notification here
        }
    </script>
</body>
</html>
