<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#2c3e50" rx="10"/>
  
  <!-- Laptop outline -->
  <g transform="translate(35, 55)">
    <!-- Screen -->
    <rect x="15" y="5" width="100" height="65" fill="none" stroke="white" stroke-width="6" rx="3"/>
    <rect x="25" y="15" width="80" height="45" fill="#1a252f" rx="2"/>
    
    <!-- Code symbol -->
    <text x="45" y="50" fill="white" font-size="36" font-family="monospace" font-weight="bold">&lt;/&gt;</text>
    
    <!-- Base -->
    <path d="M 5 75 L 0 85 L 130 85 L 125 75 Z" fill="white" stroke="white" stroke-width="2"/>
    <ellipse cx="65" cy="85" rx="15" ry="3" fill="white"/>
  </g>
</svg>
